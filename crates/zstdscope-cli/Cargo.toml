[package]
name = "zstdscope-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command-line interface for ZstdScope."

[[bin]]
name = "zstdscope"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
zstdscope = { path = "../zstdscope", features = ["serde"] }
