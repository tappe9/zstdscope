[package]
name = "zstdscope-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command-line interface for ZstdScope."

[[bin]]
name = "zstdscope"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
zstdscope = { path = "../zstdscope" }

[dev-dependencies]
serde_json = "1.0"
