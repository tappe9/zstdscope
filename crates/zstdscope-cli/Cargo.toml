[package]
name = "zstdscope-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Command-line structural inspector for Zstandard files."
documentation = "https://docs.rs/zstdscope"
keywords = ["zstd", "zstandard", "inspection", "compression", "cli"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "zstdscope"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstdscope = { version = "0.2.0", path = "../zstdscope" }
