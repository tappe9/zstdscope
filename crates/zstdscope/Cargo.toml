[package]
name = "zstdscope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Pure Rust parser and structural inspector for Zstandard (Zstd) frames, headers, blocks, offsets, and sizes."
documentation = "https://docs.rs/zstdscope"
keywords = ["zstd", "zstandard", "parser", "compression", "binary-format"]
categories = ["compression", "parsing"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
