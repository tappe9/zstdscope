[package]
name = "zstdscope"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A pure Rust parser and inspection toolkit for the Zstandard compressed data format."

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
