name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p zstdscope --all-features --no-deps --locked

      - name: Core default features
        run: cargo test -p zstdscope --no-default-features --locked

      - name: Core WebAssembly compile
        run: cargo check -p zstdscope --target wasm32-unknown-unknown --no-default-features --locked

      - name: Core package contents
        run: cargo package -p zstdscope --list --locked

      - name: Core publish dry run
        run: cargo publish -p zstdscope --dry-run --locked

      - name: CLI package contents
        run: cargo package -p zstdscope-cli --list --locked

      - name: CLI publish dry run
        run: cargo publish -p zstdscope-cli --dry-run --locked

      - name: Packaged CLI smoke test
        shell: bash
        run: |
          cargo package -p zstdscope-cli --locked
          package_dir="$(find target/package -maxdepth 1 -type d -name 'zstdscope-cli-*' -print -quit)"
          test -n "$package_dir"

          package_version="${package_dir##*-}"
          install_root="$RUNNER_TEMP/zstdscope-install"
          cargo install --path "$package_dir" --locked --root "$install_root"

          test "$("$install_root/bin/zstdscope" --version)" = "zstdscope $package_version"
          printf '\x28\xb5\x2f\xfd\x00\x00\x01\x00\x00' > "$RUNNER_TEMP/minimal.zst"
          "$install_root/bin/zstdscope" inspect "$RUNNER_TEMP/minimal.zst"
          "$install_root/bin/zstdscope" inspect "$RUNNER_TEMP/minimal.zst" --json \
            | grep -F '"schema_version": 1'

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  msrv:
    name: MSRV (Rust 1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

  platform-tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Test workspace
        run: cargo test --workspace --all-features --locked
